info:
  name: Get subjects
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:5000/api/Subjects?Page=1&PageSize=10&Search=&SortBy=&SortDescending=false&$select=&$expand=subjects
  params:
    - name: Page
      value: "1"
      type: query
    - name: PageSize
      value: "10"
      type: query
    - name: Search
      value: ""
      type: query
    - name: SortBy
      value: ""
      type: query
    - name: SortDescending
      value: "false"
      type: query
    - name: $select
      value: ""
      type: query
    - name: $expand
      value: subjects
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
